# Atualiza os resultados do jogo do bicho automaticamente.
# Fluxo: scrape (deunoposte.com.br × bicholoterias.com.br) → verificação
# cruzada → preenche sorteios vazios em assets/data.js → commit+push.
# Divergências entre fontes ou com o já publicado NÃO são publicadas:
# abrem um issue de alerta para revisão manual.
name: Atualizar resultados

on:
  schedule:
    # 00:00–20:30 BRT (UTC-3 = BRT+3)
    - cron: "*/30 3-23 * * *"
    # 21:00–23:30 BRT
    - cron: "*/30 0-2 * * *"
  workflow_dispatch: # execução manual pela aba Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Executar scraper
        id: scrape
        continue-on-error: true
        run: node tools/scraper/run.js

      - name: Commit e push se houver mudanças
        if: always()
        run: |
          git config user.name "DeuNoBicho Bot"
          git config user.email "deunobicho-bot@users.noreply.github.com"
          git add assets/data.js assets/data-ontem.js tools/scraper/report.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos resultados."
          else
            git commit -m "Auto: resultados $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi

      - name: Alerta se houve conflitos ou erros
        if: steps.scrape.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('tools/scraper/report.json', 'utf8'));
            const body = [
              'O scraper encontrou conflitos ou erros. Esses sorteios **NÃO** foram publicados.',
              '',
              '```json',
              JSON.stringify({ conflicts: report.conflicts, errors: report.errors, unmapped: report.unmapped }, null, 2),
              '```',
              '',
              'Revise manualmente as fontes e atualize `assets/data.js` se preciso.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Revisar sorteios ${report.today}`,
              body,
              labels: ['scraper'],
            });
